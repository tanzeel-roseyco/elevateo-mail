# AIDEV-NOTE: Mirrors the fleet-02 gates that need no database: web checks, Ruby lint and Steep, secret scan.
# The Ruby test suites need the pinned Supabase stack and still run on fleet-02 (ops/tests/be02/test-suites.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, contracts, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm run check:api:v2
      - run: npm test

  server-static:
    name: Server RuboCop lint and Steep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpq-dev libyaml-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.11"
          bundler-cache: true
          working-directory: apps/server
      - run: bundle exec rubocop --lint --format simple
      - run: bundle exec steep check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history
        run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
