[package]
name="elevateo-companion-check"
version="0.1.0"
edition="2021"
[dependencies]
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.151"
sha2="=0.10.9"
reqwest={version="=0.13.5",features=["blocking","json"]}
[target.'cfg(windows)'.dependencies]
windows-sys={version="=0.59.0",features=["Win32_Foundation","Win32_Security","Win32_System_JobObjects","Win32_System_Threading","Win32_System_Pipes"]}
[features]
containment-fixtures=[]
[[bin]]
name="bridge-fixture"
path="src/bin/bridge-fixture.rs"
[[bin]]
name="elevateo-draft"
path="src/bin/elevateo-draft.rs"
