# Elevateo BE-01 local foundation. Derived (not drop-in) from supabase/supabase
# self-hosted/v0.8.2 commit 564eab8ad7840b13324f68b1bfac074ef8d51c21 docker/docker-compose.yml.
# Runtime services attach only to the internal network: no egress, no published ports.
name: elevateo-local

x-server: &server
  image: elevateo-server:be01
  networks: [runtime]
  depends_on:
    db: { condition: service_healthy }
  environment: &server-env
    RAILS_ENV: development
    ELEVATEO_MODE: local
    ELEVATEO_OUTBOUND_HOLD: "true"
    ELEVATEO_DB_HOST: db
    ELEVATEO_DB_NAME: postgres
    ELEVATEO_AUTH_URL: http://auth:9999
    ELEVATEO_STORAGE_URL: http://storage:5000
    ELEVATEO_SMTP_HOST: mailpit
    ELEVATEO_SMTP_PORT: "1025"
    ELEVATEO_MAILPIT_URL: http://mailpit:8025

services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    networks: [runtime]
    volumes:
      - ./ops/supabase/db/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./ops/supabase/db/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?generate secrets with scripts/dev bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate secrets with scripts/dev bootstrap}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: "3600"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  bootstrap:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    profiles: [tools]
    networks: [runtime]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./ops/db/bootstrap.sql:/ops/bootstrap.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
    entrypoint: ["psql", "-h", "db", "-U", "supabase_admin", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/ops/bootstrap.sql"]

  auth:
    image: supabase/gotrue:v2.196.0@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: http://localhost:9999
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: auth@elevateo.invalid
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Elevateo Local Auth
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]

  storage:
    image: supabase/storage-api:v1.74.0@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://localhost:5000
      REQUEST_ALLOW_X_FORWARDED_PATH: "false"
      FILE_SIZE_LIMIT: "10485760"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMAGE_TRANSFORMATION_ENABLED: "false"
    volumes:
      - storage-data:/var/lib/storage

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    networks: [runtime]
    environment:
      MP_SMTP_RELAY_ALL: "false"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  api:
    <<: *server
    build:
      context: ./apps/server
    restart: unless-stopped
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:3000/health')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      <<: *server-env
      ELEVATEO_DB_ROLE: elevateo_api
      ELEVATEO_PROCESS: api
      # AIDEV-NOTE: Runtime credentials are role-specific; never inherit the bootstrap secret file.
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}

  worker:
    <<: *server
    restart: unless-stopped
    command: ["bin/worker"]
    healthcheck:
      test: ["CMD", "ruby", "bin/worker-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      <<: *server-env
      ELEVATEO_DB_ROLE: elevateo_worker
      ELEVATEO_PROCESS: worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}

  migrate:
    <<: *server
    profiles: [tools]
    command: ["bin/rails", "db:migrate"]
    environment:
      <<: *server-env
      ELEVATEO_DB_ROLE: elevateo_migrator
      ELEVATEO_PROCESS: migrate
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}

networks:
  runtime:
    internal: true

volumes:
  db-data:
  db-config:
  storage-data:
