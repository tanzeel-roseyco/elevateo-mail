[package]
name = "elevateo-agent-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
url = "=2.5.8"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

