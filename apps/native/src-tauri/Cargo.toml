[package]
name = "elevateo-native"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
tauri = "=2.12.0"
url = "=2.5.2"
base64 = "=0.22.1"
getrandom = "=0.2.15"
sha2 = "=0.10.8"
subtle = "=2.6.1"
zeroize = "=1.8.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[profile.release]
panic = "abort"
