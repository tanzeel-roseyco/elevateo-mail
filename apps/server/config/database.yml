<% require "json"; cfg = Elevateo::Config.load!; scalar = ->(value) { JSON.generate(value).gsub(/[\u007f-\u009f\u2028\u2029\ufffe\uffff]/) { |character| format("\\u%04x", character.ord) } } %>
default: &default
  adapter: postgresql
  # AIDEV-NOTE: Escape YAML separators/noncharacters; retain UTF-8 because Psych rejects JSON surrogate pairs.
  host: <%= scalar.call(cfg.db_host) %>
  database: <%= scalar.call(cfg.db_name) %>
  username: <%= scalar.call(cfg.db_role) %>
  password: <%= scalar.call(cfg.db_password) %>
  pool: <%= cfg.db_pool %>
  schema_search_path: app,app_meta
  migrations_paths: db/migrate
development:
  <<: *default
test:
  <<: *default
# AIDEV-NOTE: Production keeps the same restricted API/worker/migrator roles and private database network.
production:
  <<: *default
