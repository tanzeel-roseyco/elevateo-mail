# AIDEV-NOTE: Isolated test-only Auth double; never used by the production compose manifest.
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 32; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 9999;
    location = /authorize {
      return 200 "path=$request_uri host=$host proto=$http_x_forwarded_proto cookie=$http_cookie auth=$http_authorization forwarded=$http_forwarded";
    }
    location = /callback {
      add_header Set-Cookie "auth=opaque; HttpOnly";
      return 302 https://mail.elevateoco.com/v1/auth/sso/callback?code=opaque;
    }
  }
}
