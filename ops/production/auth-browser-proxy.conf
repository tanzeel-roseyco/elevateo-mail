# AIDEV-NOTE: Railway strips /auth/v1; only Authentik's browser entry/callback reach private Auth through this bridge.
worker_processes 1;
pid /tmp/nginx.pid;
# AIDEV-NOTE: Even critical request errors can include the URI; health checks provide diagnostics without OAuth logs.
error_log /dev/null crit;
events { worker_connections 128; }
http {
  # AIDEV-NOTE: OAuth query codes/state must never enter proxy access/error logs, caches or referrers.
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_set_header Host mail.elevateoco.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host mail.elevateoco.com;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    location = /authorize {
      limit_except GET { deny all; }
      proxy_pass http://auth:9999;
    }
    # AIDEV-NOTE: Loopback-only readiness exercises the private Auth upstream without admitting public admin routes.
    location = /health {
      allow 127.0.0.1;
      deny all;
      limit_except GET { deny all; }
      proxy_pass http://auth:9999/health;
    }
    location = /callback {
      limit_except GET { deny all; }
      proxy_pass http://auth:9999;
    }
    location / { return 404; }
  }
}
