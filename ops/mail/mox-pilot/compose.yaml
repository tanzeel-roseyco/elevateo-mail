services:
  guard:
    image: ${PROBE_IMAGE:?immutable Python image digest required}
    pull_policy: never
    command: ["python", "-c", "from pathlib import Path; assert not Path('/pilot-data/localserve').exists(), 'refusing existing config'"]
    volumes:
      - pilot-data:/pilot-data:ro
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: "no"

  init:
    image: ${MOX_IMAGE:?immutable Mox image digest required}
    pull_policy: never
    entrypoint: ["/mox"]
    command: ["localserve", "-dir", "/pilot-data/localserve", "-ip", "0.0.0.0", "-initonly"]
    read_only: true
    volumes:
      - pilot-data:/pilot-data
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: "no"

  cert_export:
    image: ${PROBE_IMAGE:?immutable Python image digest required}
    pull_policy: never
    user: "0:0"
    command: ["python", "-c", "from pathlib import Path; import shutil; source=Path('/pilot-data/localserve/localhost.crt'); target=Path('/pilot-evidence/mox-localserve-trust.crt'); assert source.is_file() and not target.exists(); shutil.copyfile(source, target); target.chmod(0o600)"]
    volumes:
      - pilot-data:/pilot-data:ro
      - ${MOX_PILOT_RECEIPT_DIR:?private pilot receipt directory required}:/pilot-evidence
    network_mode: "none"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: "no"

  mox:
    image: ${MOX_IMAGE:?immutable Mox image digest required}
    pull_policy: never
    entrypoint: ["/mox"]
    # AIDEV-NOTE: Init writes the listener IP once; repeated -ip rejects existing config.
    command: ["localserve", "-dir", "/pilot-data/localserve"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - pilot-data:/pilot-data
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "1"}

  probe:
    image: ${PROBE_IMAGE:?immutable Python image digest required}
    pull_policy: never
    command: ["python", "/pilot/probe.py"]
    working_dir: /pilot
    environment:
      MOX_PILOT_SUBJECT: ${MOX_PILOT_SUBJECT:?synthetic subject required}
      PROBE_VERIFY_EXISTING: ${PROBE_VERIFY_EXISTING:-0}
    volumes:
      - ./probe.py:/pilot/probe.py:ro
      - ${MOX_PILOT_RECEIPT_DIR:?private pilot receipt directory required}:/pilot-evidence
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"
    depends_on: [mox]

  tls_probe:
    image: ${PROBE_IMAGE:?immutable Python image digest required}
    pull_policy: never
    user: "0:0"
    command: ["python", "/pilot/tls_probe.py"]
    environment:
      MOX_PILOT_SUBJECT: ${MOX_PILOT_SUBJECT:?synthetic subject required}
      PROBE_VERIFY_EXISTING: ${PROBE_VERIFY_EXISTING:-0}
    volumes:
      - ./tls_probe.py:/pilot/tls_probe.py:ro
      - ${MOX_PILOT_RECEIPT_DIR:?private pilot receipt directory required}:/pilot-evidence:ro
    # AIDEV-NOTE: Mox localserve cert has SAN localhost; this shares only its private network namespace.
    network_mode: "service:mox"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    depends_on: [mox]

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    pull_policy: never
    environment:
      MP_SMTP_RELAY_ALL: "false"
      MP_SMTP_DISABLE_RDNS: "true"
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    restart: "no"

  mailpit_probe:
    image: ${PROBE_IMAGE:?immutable Python image digest required}
    pull_policy: never
    command: ["python", "/pilot/mailpit_probe.py"]
    environment:
      MOX_PILOT_SUBJECT: ${MOX_PILOT_SUBJECT:?synthetic subject required}
    volumes:
      - ./mailpit_probe.py:/pilot/mailpit_probe.py:ro
    networks:
      - pilot
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    depends_on: [mailpit]

networks:
  pilot:
    internal: true

volumes:
  pilot-data:
