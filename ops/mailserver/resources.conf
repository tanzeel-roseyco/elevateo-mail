# Install as /etc/systemd/system/mox.service.d/resources.conf only during native activation.
# AIDEV-NOTE: Bounded CPU/memory limit cost; the 356 MiB fixture peak does not certify production demand.
[Service]
Environment=GOMAXPROCS=2
Environment=GOMEMLIMIT=512MiB
CPUQuota=200%
MemoryHigh=768M
MemoryMax=2G
TasksMax=128
LimitNOFILE=8192
TimeoutStopSec=60s
RestartSec=10s
