# AIDEV-NOTE: Apply after ops/production/compose.yaml; SSH never joins the data network or mounts host authority.
services:
  launch-api:
    networks: [private, transport]
  auth-browser-proxy:
    networks:
      private: {}
      transport:
        aliases: [oauth-proxy]
  launch-transport:
    image: ${ELEVATEO_TRANSPORT_IMAGE:?set reviewed immutable transport image}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/run:mode=0755", "/run/sshd:mode=0755", "/tmp:mode=0700"]
    volumes:
      - type: bind
        source: ${ELEVATEO_TRANSPORT_KEYS_DIR:?set protected dedicated transport key directory}
        target: /run/keys
        read_only: true
    ports: ["2223:2222"]
    networks: [transport]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  transport:
    driver: bridge
