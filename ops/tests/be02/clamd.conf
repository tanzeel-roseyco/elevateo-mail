# AIDEV-NOTE: Disposable offline test configuration; bundled signatures are fixed by the image digest.
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 8
ReadTimeout 20
CommandReadTimeout 5
SendBufTimeout 500
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 25M
MaxRecursion 8
MaxFiles 100
MaxScanTime 15000
AlertExceedsMax yes
ScanArchive yes
ConcurrentDatabaseReload no
EnableShutdownCommand no
EnableReloadCommand no
LogTime yes
LogClean no
