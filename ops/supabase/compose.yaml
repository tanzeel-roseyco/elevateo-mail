# OPS-402: derived from canonical compose.yaml, self-hosted/v0.8.2.
# AIDEV-NOTE: persistent live/test projects must never share secrets or volumes.
services:
  db:
    mem_limit: 1536m
    cpus: "2"
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    networks: [private]
    volumes:
      - ./db/98-service-identities.sql:/docker-entrypoint-initdb.d/init-scripts/99-identities.sql:ro
      - ./db/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?generate secrets with scripts/dev bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate secrets with scripts/dev bootstrap}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: "3600"
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      REST_DB_PASSWORD: ${REST_DB_PASSWORD:?}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:?}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    mem_limit: 256m
    cpus: "1"
    ports: ["127.0.0.1:${AUTH_PORT:?}:9999"]
    image: supabase/gotrue:v2.196.0@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232
    restart: unless-stopped
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${AUTH_PORT:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      # AIDEV-NOTE: Approved absolute lifetime; independent inactivity and low-AAL limits stay absent.
      GOTRUE_SESSIONS_TIMEBOX: "12h"
      GOTRUE_SESSIONS_SINGLE_PER_USER: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${AUTH_PORT:?}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: auth@elevateo.invalid
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Elevateo Local Auth
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify

  rest:
    mem_limit: 256m
    cpus: "1"
    ports: ["127.0.0.1:${REST_PORT:?}:3000"]
    image: postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    restart: unless-stopped
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]

  storage:
    mem_limit: 768m
    cpus: "1"
    ports: ["127.0.0.1:${STORAGE_PORT:?}:5000"]
    image: supabase/storage-api:v1.74.0@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85
    restart: unless-stopped
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${STORAGE_DB_PASSWORD:?}@db:5432/postgres
      STORAGE_PUBLIC_URL: http://127.0.0.1:${STORAGE_PORT:?}
      REQUEST_ALLOW_X_FORWARDED_PATH: "false"
      FILE_SIZE_LIMIT: "10485760"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STACK_ID:?}
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMAGE_TRANSFORMATION_ENABLED: "false"
    volumes:
      - storage-data:/var/lib/storage

  mailpit:
    mem_limit: 128m
    cpus: "0.5"
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    networks: [private]
    environment:
      MP_SMTP_RELAY_ALL: "false"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

networks:
  private:
    internal: true
volumes:
  db-data:
  db-config:
  storage-data:
